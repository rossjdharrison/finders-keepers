<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Computable Records — Product Studio</title>
    <style>
      :root {
        --bg: #0f1116; --panel: #171a21; --line: #262e39; --ink: #e7eaef;
        --ink2: #aab2bf; --faint: #7c8492; --accent: #6f97ff; --good: #37b391;
        --computed: #9db2d6; --error: #f0665f; --chip: #1c232d;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font-size: 14px; }
      .topbar { display: flex; align-items: center; gap: 20px; padding: 14px 22px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); }
      .brand { font-weight: 600; letter-spacing: -.01em; }
      .muted { color: var(--faint); font-weight: 400; }
      .tabs { display: flex; gap: 6px; margin-left: 8px; }
      .tabs button { background: transparent; color: var(--ink2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 14px; font-size: 13px; cursor: pointer; }
      .tabs button.active { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--ink); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
      .conn { margin-left: auto; font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); border: 1px solid var(--line); border-radius: 20px; padding: 3px 10px; }
      .conn[data-status="open"] { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
      .conn[data-status="closed"] { color: var(--error); }
      .mount { padding: 22px; }
      .hint { padding: 0 22px 26px; color: var(--faint); font-size: 12.5px; }
      .hint b { color: var(--computed); }

      table.view-table { border-collapse: collapse; width: 100%; max-width: 900px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
      .view-table th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 500; padding: 11px 14px; border-bottom: 1px solid var(--line); }
      .view-table td { padding: 6px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
      .view-table tr:last-child td { border-bottom: none; }
      .cell { display: inline-block; padding: 4px 2px; }
      .cell.computed { color: var(--computed); font-variant-numeric: tabular-nums; font-weight: 500; }
      .cell.error { color: var(--error); font-family: ui-monospace, monospace; }
      .cell-input { background: var(--chip); color: var(--ink); border: 1px solid transparent; border-radius: 6px; padding: 5px 8px; font: inherit; width: 100%; max-width: 160px; }
      .cell-input:hover { border-color: var(--line); }
      .cell-input:focus { outline: none; border-color: var(--accent); background: var(--bg); }
      td .empty, .empty { color: var(--faint); font-style: italic; }
      .view-table td.cell-gated { color: var(--faint); text-align: center; opacity: .5; }

      .view-board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr); gap: 14px; align-items: start; max-width: 1000px; }
      .board-col { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-height: 90px; }
      .board-col.drop { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--panel)); }
      .board-col-head { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 600; padding: 2px 4px 10px; }
      .board-card { background: var(--chip); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; margin-bottom: 8px; cursor: grab; }
      .board-card:active { cursor: grabbing; }
      .card-line { font-size: 12.5px; color: var(--ink2); }
      .card-line:first-child { color: var(--ink); font-weight: 600; margin-bottom: 3px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
