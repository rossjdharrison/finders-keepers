<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Computable Records — Product Studio</title>
    <!-- Style lives in src/style/ (tiered tokens + @layer). main.ts imports it; Vite bundles it. -->
    <!-- Theme selection is DATA: apply the saved choice (else the OS preference) before first
         paint, so there is no flash. The values themselves live in the theme CSS (the residue). -->
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('fk-theme') ||
          (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
