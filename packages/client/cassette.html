<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rowblaa Bank — Autoverzekering</title>
    <meta name="description" content="Rowblaa Bank — autoverzekering aanvragen. Een model-gestuurde aanvraagreis die volledig in de browser draait." />
    <!-- The brand fonts named in the cassette theme (Inter for UI, Source Serif 4 for the wordmark).
         The font-family stacks fall back to system faces, so the page holds if these do not load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap"
    />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('fk-theme') ||
          (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/cassette.ts"></script>
  </body>
</html>
